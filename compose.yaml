services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: rehearse_dev
      POSTGRES_USER: ${POSTGRES_USER:?Set a local development PostgreSQL user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development PostgreSQL password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_development:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_development:
